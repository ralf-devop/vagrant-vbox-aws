---
- name: provision vagrant box
  hosts: all
  vars:
    node_version: "v24.14.1"
    kubectl_version: "v1.36.0"
    eksctl_version: "v0.229.0"
  gather_facts: no
  become: yes

  tasks:

    - name: Set timezone
      ansible.builtin.command: "timedatectl set-timezone Europe/Berlin"

    - name: Add Hashicorp apt repo
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: noble
        components: main
        architectures: amd64
        signed_by: https://apt.releases.hashicorp.com/gpg
        install_python_debian: true

    - name: Install packages
      ansible.builtin.apt:
        name:
          - unzip
          - vim
          - jq
          - python3
          - python3-pip
          - python3-venv
          - terraform
          - bash-completion
        update_cache: yes

    - name: Remove other motds
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_fileglob: "/etc/update-motd.d/??-[!w]*"

    - name: Set message of the day
      ansible.builtin.copy:
        src: ./motd
        dest: /etc/update-motd.d/00-welcome
        owner: root
        group: root
        mode: '0755'

    - name: Copy script to check aws env vars
      ansible.builtin.copy:
        src: ./check_aws_vars.sh
        dest: /usr/local/bin/
        owner: root
        group: root
        mode: '0755'

    - name: Check if awscli is already installed
      ansible.builtin.stat:
        path: "/usr/local/bin/aws"
      register: "aws_check"

    - name: Download and extract awscli
      ansible.builtin.unarchive:
        src: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /var/tmp
        remote_src: yes
      when: "not aws_check.stat.exists"

    - name: Install aws-cli
      ansible.builtin.command: "/var/tmp/aws/install"
      when: "not aws_check.stat.exists"

    - name: Add aws command completion
      ansible.builtin.lineinfile:
        path: /home/vagrant/.bashrc
        regexp: '^complete -C /usr/local/bin/aws_completer aws'
        line: 'complete -C /usr/local/bin/aws_completer aws'

    - name: Ensure NVM Installation script ist executable
      ansible.builtin.file:
        path: "./nvm_install.sh"
        mode: '774'

    - name: Install Node Version Manager
      ansible.builtin.command: "./nvm_install.sh | bash && source ~/.bashrc"

    - name: Install Node, NPM and AWS CDK
      ansible.builtin.shell: |
                    . /root/.nvm/nvm.sh
                    nvm install "{{ node_version }}"
                    npm install -g aws-cdk

    - name: Check if kubectl is already installed
      ansible.builtin.stat:
        path: "/usr/local/bin/kubectl"
      register: "kubectl_check"

    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /var/tmp
      when: "not kubectl_check.stat.exists"

    - name: Install kubectl
      ansible.builtin.command: "install -o root -g root -m 0755 /var/tmp/kubectl /usr/local/bin/"
      when: "not kubectl_check.stat.exists"

    - name: Add kubectl command completion
      ansible.builtin.lineinfile:
        path: /home/vagrant/.bashrc
        regexp: '^source <(kubectl completion bash)'
        line: 'source <(kubectl completion bash)'

    - name: Check if eksctl is already installed
      ansible.builtin.stat:
        path: "/usr/local/bin/eksctl"
      register: "eksctl_check"

    - name: Download and extract eksctl
      ansible.builtin.unarchive:
        src: "https://github.com/eksctl-io/eksctl/releases/download/{{ eksctl_version }}/eksctl_Linux_amd64.tar.gz"
        dest: /var/tmp
        remote_src: yes
      when: "not eksctl_check.stat.exists"

    - name: Install eksctl
      ansible.builtin.command: "install -o root -g root -m 0755 /var/tmp/eksctl /usr/local/bin/"
      when: "not eksctl_check.stat.exists"

    - name: Add eksctl command completion
      ansible.builtin.lineinfile:
        path: /home/vagrant/.bashrc
        regexp: '^source <(eksctl completion bash)'
        line: 'source <(eksctl completion bash)'

    - name: Modify profile
      ansible.builtin.blockinfile:
        path: /home/vagrant/.profile
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # set PATH so it includes node
          if [ -d "/usr/bin/versions/node/{{ node_version }}/bin" ] ; then
              PATH="$PATH:/usr/bin/versions/node/{{ node_version }}/bin"
          fi
