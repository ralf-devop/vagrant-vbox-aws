---
- name: provision vagrant box
  hosts: all
  vars:
    node_version: "v24.14.1"
    kubectl_version: "v1.36.0"
    eksctl_version: "v0.229.0"
  gather_facts: no
  become: yes

  tasks:

    - name: Set timezone
      ansible.builtin.command: "timedatectl set-timezone Europe/Berlin"

    - name: Add Hashicorp apt repo
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: noble
        components: main
        architectures: amd64
        signed_by: https://apt.releases.hashicorp.com/gpg
        install_python_debian: true

    - name: Install packages
      ansible.builtin.apt:
        name:
          - unzip
          - vim
          - jq
          - python3
          - python3-pip
          - python3-venv
          - terraform
          - bash-completion
        update_cache: yes

    - name: Remove other motds
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_fileglob: "/etc/update-motd.d/??-[!w]*"

    - name: Set message of the day
      ansible.builtin.copy:
        src: ./motd
        dest: /etc/update-motd.d/00-welcome
        owner: root
        group: root
        mode: '0755'

    - name: Copy script to check aws env vars
      ansible.builtin.copy:
        src: ./check_aws_vars.sh
        dest: /usr/local/bin/
        owner: root
        group: root
        mode: '0755'

    - include_tasks: tasks/awscli.yml

    - name: Ensure NVM Installation script ist executable
      ansible.builtin.file:
        path: "./nvm_install.sh"
        mode: '774'

    - name: Install Node Version Manager
      ansible.builtin.command: "./nvm_install.sh | bash && source ~/.bashrc"

    - name: Install Node, NPM and AWS CDK
      ansible.builtin.shell: |
                    . /root/.nvm/nvm.sh
                    nvm install "{{ node_version }}"
                    npm install -g aws-cdk

    - include_tasks: tasks/k8stools.yml

    - name: Modify profile
      ansible.builtin.blockinfile:
        path: /home/vagrant/.profile
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # set PATH so it includes node
          if [ -d "/usr/bin/versions/node/{{ node_version }}/bin" ] ; then
              PATH="$PATH:/usr/bin/versions/node/{{ node_version }}/bin"
          fi
